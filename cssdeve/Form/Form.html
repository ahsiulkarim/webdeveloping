<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Added viewport meta tag for responsiveness -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Example - Retro Style</title>
    <link href="styles.css" rel="stylesheet"/>
</head>
<body>
    <form class="form-container">
        <label for="family-name">Family name:</label>
        <input type="text" id="family-name" name="family-name" placeholder="Enter your family name">

        <label for="other-name">Other name(s):</label>
        <input type="text" id="other-name" name="other-name" placeholder="Enter your other name(s)">

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" placeholder="Enter your street address">

        <label for="suburb">Suburb:</label>
        <input type="text" id="suburb" name="suburb" placeholder="Enter your suburb">

        <label for="state-territory">State/Territory:</label>
        <!-- Changed to a select dropdown -->
        <select id="state-territory" name="state-territory">
            <option value="">Please select...</option>
            <option value="DHK">DHK</option>
            <option value="CTG">CTG</option>
            <option value="KHU">KHU</option>
            <option value="RAJ">RAJ</option>
            <option value="SYL">SYL</option>
            <option value="BAR">BAR</option>
            <option value="RNG">RNG</option>
            <option value="MYM">MYM</option>
        </select>

        <!-- Used fieldset and legend for grouping checkboxes -->
        <fieldset class="form-group">
            <legend>Request Course Info On:</legend>
            <label><input type="checkbox" name="course-info" value="engineering"> Engineering</label><br>
            <label><input type="checkbox" name="course-info" value="it"> IT</label><br>
            <label><input type="checkbox" name="course-info" value="law"> Law</label><br>
            <label><input type="checkbox" name="course-info" value="medicine"> Medicine</label><br>
            <label><input type="checkbox" name="course-info" value="nursing"> Nursing</label><br>
        </fieldset>

        <!-- Used fieldset and legend for grouping radio buttons -->
        <fieldset class="form-group">
            <legend>Highest Current Degree:</legend>
            <label><input type="radio" name="degree" value="diploma"> Diploma</label><br>
            <label><input type="radio" name="degree" value="degree"> Degree</label><br>
            <label><input type="radio" name="degree" value="honours"> Honours</label><br>
            <label><input type="radio" name="degree" value="masters"> Masters</label><br>
            <label><input type="radio" name="degree" value="phd"> PhD</label><br>
        </fieldset>

        <label for="comments">Comments:</label>
        <textarea id="comments" name="comments" rows="4"></textarea>

        <!-- Added container for buttons -->
        <div class="button-container">
            <input type="submit" value="Submit Enquiry">
            <input type="reset" value="Clear Form">
        </div>
    </form>
</body>
</html>
